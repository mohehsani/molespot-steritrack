<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SteriTrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SteriTrack">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1C1E21; --inkSoft:#33363B; --sub:#5B6066; --faint:#9AA0A6;
    --line:#E3E5E7; --lineStrong:#C9D2D8; --bg:#F7F7F8; --panel:#2B2E33; --white:#FFFFFF;
    --dirty:#6B6F76; --dirtyBg:#EDEEF0; --sterile:#0F7A6C; --sterileBg:#0F7A6C1A;
    --alert:#B3261E; --alertBg:#B3261E0D; --alertBorder:#B3261E33;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}
  .display{font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-weight:700;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}

  /* header */
  .header{position:sticky; top:0; z-index:20; background:var(--ink); color:var(--white);
    padding:calc(20px + env(safe-area-inset-top)) 20px 16px;}
  .header-row{display:flex; align-items:center; justify-content:space-between;}
  .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:600;}
  .title{font-size:22px; font-weight:700;}
  .btn-new{min-height:46px; padding:0 16px; background:var(--white); color:var(--ink);
    border:none; border-radius:12px; font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px;}
  .tabs{display:flex; gap:4px; margin-top:16px; background:var(--panel); border-radius:10px; padding:4px;}
  .tab{flex:1; min-height:40px; border:none; border-radius:8px; font-weight:600; font-size:13px;
    background:transparent; color:#C9CDD1; display:flex; align-items:center; justify-content:center; gap:6px;}
  .tab.active{background:var(--white); color:var(--ink);}

  .content{padding:16px; max-width:720px; margin:0 auto;}

  /* empty state */
  .empty{text-align:center; padding:80px 24px;}
  .empty-icon{width:56px; height:56px; border-radius:16px; background:var(--white); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:24px;}
  .empty-title{font-weight:700; margin-bottom:4px; font-size:16px;}
  .empty-sub{font-size:14px; color:var(--faint); margin-bottom:20px;}

  /* card */
  .card{width:100%; text-align:left; background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px; display:block;}
  .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px;}
  .card-id{font-size:13px; font-weight:600;}
  .badge{padding:2px 8px; font-size:12px; font-weight:600; border-radius:6px; white-space:nowrap;}
  .badge-neutral{background:var(--dirtyBg); color:#4A4E54;}
  .badge-sterile{background:var(--sterileBg); color:var(--sterile);}
  .badge-alert{background:#B3261E1A; color:var(--alert);}
  .card-contents{font-size:15px; font-weight:500; margin-bottom:2px;}
  .card-meta{font-size:13px; color:var(--faint); display:flex; gap:12px; flex-wrap:wrap;}

  /* zone rail */
  .rail{display:flex; align-items:center; gap:4px; width:100%; margin-top:12px;}
  .rail-step{flex:1; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; text-align:center; padding:0 4px;
    border:1px solid var(--line); background:#F4F5F6; color:var(--faint);}
  .rail-arrow{color:var(--lineStrong); font-size:12px; flex-shrink:0;}

  /* search/export row */
  .row-gap{display:flex; gap:8px; margin-bottom:12px;}
  .search-wrap{position:relative; flex:1;}
  .search-wrap input{padding-left:36px;}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:14px;}
  .btn-export{min-height:46px; padding:0 16px; border-radius:10px; border:1px solid var(--lineStrong);
    background:var(--white); font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; color:var(--ink);}

  /* form controls */
  .field{display:block; margin-bottom:16px;}
  .field-label{display:block; font-size:13px; font-weight:500; color:var(--sub); margin-bottom:6px;}
  .input, select.input{width:100%; min-height:46px; padding:0 14px; border-radius:10px; border:1px solid var(--lineStrong);
    background:var(--white); font-size:15px; color:var(--ink); outline:none;}
  select.input{appearance:auto; -webkit-appearance:menulist;}
  .yn-row{display:flex; gap:8px;}
  .yn-btn{flex:1; min-height:46px; border-radius:10px; font-weight:600; font-size:14px; border:1px solid var(--lineStrong);
    background:var(--white); color:var(--sub);}
  .yn-btn.sel-pos{background:var(--sterile); color:var(--white); border-color:var(--sterile);}
  .yn-btn.sel-neg{background:var(--alert); color:var(--white); border-color:var(--alert);}
  .checkbox-row{display:flex; align-items:center; gap:12px; background:var(--white); border:1px solid var(--lineStrong);
    border-radius:10px; padding:0 14px; min-height:46px; margin-bottom:8px;}
  .checkbox-row input{width:20px; height:20px;}

  /* buttons */
  .btn{min-height:52px; padding:0 20px; border-radius:12px; font-weight:600; font-size:15px; border:none;
    display:flex; align-items:center; justify-content:center; gap:8px; flex:1;}
  .btn-primary{background:var(--ink); color:var(--white);}
  .btn-ghost{background:var(--white); color:var(--ink); border:1px solid var(--lineStrong);}
  .btn-danger{background:var(--alert); color:var(--white);}
  .btn-success{background:var(--sterile); color:var(--white);}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn-row{display:flex; gap:8px;}

  /* sheet / modal */
  .overlay{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.3); display:flex;
    align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:560px; max-height:92vh; background:var(--bg); border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; overflow:hidden;}
  .sheet-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    border-bottom:1px solid var(--line); background:var(--white);}
  .sheet-title{font-size:17px; font-weight:700;}
  .sheet-close{width:36px; height:36px; border-radius:999px; background:#F4F5F6; border:none;
    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink);}
  .sheet-body{overflow-y:auto; padding:16px 20px; flex:1; -webkit-overflow-scrolling:touch;}
  .sheet-footer{padding:16px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);
    background:var(--white); display:flex; gap:8px;}

  /* stage blocks */
  .stage-block{border-radius:14px; padding:16px; margin-bottom:14px;}
  .stage-block.pending{border:1px solid var(--ink); background:var(--white);}
  .stage-block.done{border:1px solid var(--line); background:#FAFAFA;}
  .stage-head{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:600; font-size:14px;}
  .stage-head .check{margin-left:auto; color:var(--sterile);}
  .summary-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:13px;}
  .summary-row .val{font-weight:500; color:var(--ink); text-align:right;}
  .hint{font-size:13px; color:var(--sub); background:#F4F5F6; border-radius:10px; padding:12px; margin-bottom:16px;}
  .warn-text{font-size:13px; color:var(--alert); margin-bottom:8px;}
  .alert-box{background:var(--alertBg); border:1px solid var(--alertBorder); border-radius:10px; padding:14px;
    font-size:14px; color:var(--alert); margin-bottom:16px;}
  .quarantine-link{display:block; width:100%; text-align:center; font-size:13px; color:var(--alert);
    font-weight:500; padding-top:8px; background:none; border:none;}

  .toast{position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--faint); background:var(--white);
    border:1px solid var(--line); border-radius:999px; padding:4px 12px; z-index:40;}

  /* pack chips */
  .pack-add-row{display:flex; gap:8px; margin-bottom:10px;}
  .pack-add-row select{flex:1;}
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .chip{display:flex; align-items:center; gap:6px; background:var(--dirtyBg); border-radius:999px;
    padding:6px 6px 6px 14px; font-size:13px; font-weight:500;}
  .chip button{width:20px; height:20px; border-radius:999px; background:rgba(0,0,0,.08); border:none;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub);}
  .chip-empty{font-size:13px; color:var(--faint); padding:8px 0;}

  /* per-pack release card */
  .pack-item{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--white);}
  .pack-item.pack-released{background:var(--sterileBg); border-color:var(--sterile);}
  .pack-item.pack-quarantined{background:var(--alertBg); border-color:var(--alert);}
  .pack-item-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .pack-item-name{font-weight:600; font-size:14px;}

  .setup-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .setup-card{width:100%; max-width:440px; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:28px; text-align:center;}
  .setup-title{font-size:20px; font-weight:700; margin-bottom:6px;}
  .setup-sub{font-size:13px; color:var(--sub); margin-bottom:20px; line-height:1.5;}
  .setup-err{font-size:13px; color:var(--alert); margin-bottom:16px; text-align:left; background:var(--alertBg); border:1px solid var(--alertBorder); border-radius:10px; padding:12px;}
  .sync-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:6px;}
  .sync-dot.ok{background:var(--sterile);}
  .sync-dot.bad{background:var(--alert);}
  .sync-dot.pending{background:#E0A800;}
  .signed-in-as{font-size:11px; color:var(--faint); margin-top:2px;}
  .signout-link{font-size:11px; color:var(--faint); text-decoration:underline; background:none; border:none; padding:0;}

  /* month filter + export row */
  .export-row{display:flex; gap:8px; flex-wrap:wrap;}
  .month-input{min-height:46px; padding:0 12px; border-radius:10px; border:1px solid var(--lineStrong); background:var(--white); font-size:14px; color:var(--ink);}

  /* printable report — hidden on screen, shown only when printing */
  #print-report{display:none;}
  @media print {
    body > *:not(#print-report){display:none !important;}
    #print-report{display:block !important; padding:24px; font-family:-apple-system,sans-serif; color:#111;}
    #print-report h1{font-size:20px; margin:0 0 4px;}
    #print-report .pr-sub{font-size:12px; color:#555; margin-bottom:18px;}
    #print-report table{width:100%; border-collapse:collapse; font-size:11px;}
    #print-report th, #print-report td{border:1px solid #999; padding:5px 7px; text-align:left;}
    #print-report th{background:#eee;}
    #print-report .pr-summary{font-size:12px; margin-bottom:14px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report"></div>

<script>
(function(){
  "use strict";

  // ---------- Microsoft 365 / SharePoint configuration ----------
  var MSAL_CONFIG = {
    auth: {
      clientId: "3da51dfd-c402-4ddd-b05e-0b8cfcdab763",
      authority: "https://login.microsoftonline.com/57a5a310-7a72-4b1d-8a77-ef7338ab2035",
      redirectUri: "https://mohehsani.github.io/molespot-steritrack/",
    },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false },
  };
  var GRAPH_SCOPES = ["Sites.ReadWrite.All"];
  var SP_HOSTNAME = "molespot.sharepoint.com";
  var SP_SITE_PATH = "/sites/MoleSpotSkinCancerClinic";
  var GRAPH_BASE = "https://graph.microsoft.com/v1.0";
  // SharePoint keeps the internal field name "Title" for the built-in column even after
  // it's been renamed (LoadId / PackId / Category) in the UI — see note above.
  var TITLE_FIELD = "Title";

  var msalInstance = null;
  var activeAccount = null;
  var siteId = null;
  var syncStatus = "pending"; // pending | ok | bad
  var pollTimer = null;

  var DEFAULT_LISTS = {
    instrumentSets: [], washerPrograms: [], operators: [],
    sterPrograms: ["Universal-Program 134°C wrapped", "Quick-Program S 134°C unwrapped", "Gentle-Program 121°C", "Prion-Program 134°C wrapped"],
    checkTypes: ["Vacuum Test", "Washer Disinfector Soil Test (AXCP120)"]
  };
  var PPE_ITEMS = ["Utility/heavy-duty gloves","Protective eyewear or face shield","Fluid-resistant apron/gown","Closed footwear"];
  var STAGES = [
    {key:"washing", label:"Washing"},
    {key:"ready_to_pack", label:"Ready to pack"},
    {key:"sterilising", label:"Sterilising"},
    {key:"cooling", label:"Cooling"},
    {key:"done", label:"Cool & release"},
  ];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function todayStamp(){
    var d = new Date();
    return "" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  }
  function fmtTime(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleString("en-AU", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function stageIdx(key){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].key===key) return i; return -1; }

  // ---------- pack-status helpers ----------
  function packCounts(load){
    var packs = load.packs || [];
    var released = packs.filter(function(p){return p.status==="released";}).length;
    var quarantined = packs.filter(function(p){return p.status==="quarantined";}).length;
    var pending = packs.filter(function(p){return p.status==="pending";}).length;
    return {total: packs.length, released:released, quarantined:quarantined, pending:pending};
  }
  function overallStatus(load){
    if(load.stage === "quarantined") return {label:"Quarantined", tone:"alert"};
    if(load.stage !== "done"){
      var s = STAGES.filter(function(x){return x.key===load.stage;})[0];
      return {label: s ? s.label : load.stage, tone:"neutral"};
    }
    var c = packCounts(load);
    if(c.pending > 0) return {label:"Releasing ("+(c.released+c.quarantined)+"/"+c.total+")", tone:"neutral"};
    if(c.quarantined === 0) return {label:"Released", tone:"sterile"};
    if(c.released === 0) return {label:"All quarantined", tone:"alert"};
    return {label:"Partially released", tone:"alert"};
  }
  function isActiveLoad(load){
    if(load.stage === "quarantined") return false;
    if(load.stage !== "done") return true;
    return packCounts(load).pending > 0;
  }

  // ---------- state ----------
  var state = {
    loads: [],
    checks: [],
    lists: Object.assign({}, DEFAULT_LISTS),
    tab: "active",
    openLoadId: null,
    showNew: false,
    showNewCheck: false,
    search: "",
    exportMonth: currentMonthKey(),
    checksMonth: currentMonthKey(),
    confirming: null,     // which inline form is open inside the detail sheet
    addingField: null,    // which ComboField is in "add new" mode
  };
  // Maps our own string IDs (LoadId / PackId / list Category) to SharePoint's internal
  // numeric list-item IDs, since Graph needs the numeric ID to PATCH an existing item.
  var loadItemIds = {};   // { "W-20260812-01": 14 }
  var packItemIds = {};   // { "<packUid>": 37 }
  var listItemIds = {};   // { "operators": 3 }
  var checkItemIds = {};  // { "DC-20260812-1": 8 }

  // ---------- Microsoft Graph helpers ----------
  async function getToken(){
    try {
      var res = await msalInstance.acquireTokenSilent({scopes: GRAPH_SCOPES, account: activeAccount});
      return res.accessToken;
    } catch(e){
      var res2 = await msalInstance.acquireTokenRedirect({scopes: GRAPH_SCOPES});
      // acquireTokenRedirect navigates away; nothing after this runs.
      return null;
    }
  }
  async function graphFetch(path, options){
    options = options || {};
    var token = await getToken();
    var headers = Object.assign({
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
    }, options.headers || {});
    var res = await fetch(GRAPH_BASE + path, Object.assign({}, options, {headers: headers}));
    if(!res.ok){
      var body = await res.text();
      throw new Error("Graph " + res.status + ": " + body.slice(0, 300));
    }
    if(res.status === 204) return null;
    return res.json();
  }
  async function resolveSiteId(){
    var data = await graphFetch("/sites/" + SP_HOSTNAME + ":" + SP_SITE_PATH);
    siteId = data.id;
  }

  // ---------- Data mapping: app object <-> SharePoint list item fields ----------
  function loadToFields(l){
    return {
      Title: l.id, SterId: l.sterId||"", Stage: l.stage, Operator: l.operator||"",
      WasherProgram: l.washerProgram||"", WasherStart: l.washerStart||null, WasherResult: l.washerResult||"",
      WasherCycleNo: l.washerCycleNo||"",
      SterProgram: l.sterProgram||"", SterStart: l.sterStart||null, SterResult: l.sterResult||"",
      Releaser: l.releaser||"", QuarantineReason: l.quarantineReason||"", QuarantinedAt: l.quarantinedAt||null,
    };
  }
  function fieldsToLoad(f, itemId){
    return {
      id: f.Title, sterId: f.SterId||null, stage: f.Stage, operator: f.Operator,
      washerProgram: f.WasherProgram, washerStart: f.WasherStart, washerResult: f.WasherResult,
      washerCycleNo: f.WasherCycleNo||null,
      sterProgram: f.SterProgram, sterStart: f.SterStart, sterResult: f.SterResult,
      releaser: f.Releaser, quarantineReason: f.QuarantineReason, quarantinedAt: f.QuarantinedAt,
      createdAt: f.Created || new Date().toISOString(),
      packs: [], // filled in after packs are fetched separately
      _itemId: itemId,
    };
  }
  function packToFields(p, loadId){
    return {
      Title: p.id, LoadId: loadId, Name: p.name||"", Class1: p.class1||"",
      PouchOk: p.pouchOk||"", Status: p.status, QuarantineReason: p.quarantineReason||"",
      ReleaseTime: p.releaseTime||null, Releaser: p.releaser||"",
    };
  }
  function fieldsToPack(f, itemId){
    return {
      id: f.Title, loadId: f.LoadId, name: f.Name, class1: f.Class1||null,
      pouchOk: f.PouchOk||null, status: f.Status, quarantineReason: f.QuarantineReason,
      releaseTime: f.ReleaseTime, releaser: f.Releaser||null,
      _itemId: itemId,
    };
  }
  function checkToFields(c){
    return {
      Title: c.id, CheckType: c.checkType||"", CheckDate: c.checkDate||null,
      Result: c.result||"", Operator: c.operator||"", Notes: c.notes||"",
    };
  }
  function fieldsToCheck(f, itemId){
    return {
      id: f.Title, checkType: f.CheckType, checkDate: f.CheckDate,
      result: f.Result, operator: f.Operator, notes: f.Notes, _itemId: itemId,
    };
  }

  async function fetchAllData(){
    var loadsRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLoads/items?expand=fields&$top=500");
    var packsRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackPacks/items?expand=fields&$top=1000");
    var listsRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLists/items?expand=fields&$top=100");
    var checksRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackDailyChecks/items?expand=fields&$top=1000");

    loadItemIds = {}; packItemIds = {}; listItemIds = {}; checkItemIds = {};
    var loadsById = {};
    (loadsRes.value||[]).forEach(function(item){
      var l = fieldsToLoad(item.fields, item.id);
      loadItemIds[l.id] = item.id;
      loadsById[l.id] = l;
    });
    (packsRes.value||[]).forEach(function(item){
      var p = fieldsToPack(item.fields, item.id);
      packItemIds[p.id] = item.id;
      if(loadsById[p.loadId]) loadsById[p.loadId].packs.push(p);
    });
    var listsObj = Object.assign({}, DEFAULT_LISTS);
    (listsRes.value||[]).forEach(function(item){
      var cat = item.fields.Title;
      listItemIds[cat] = item.id;
      try { listsObj[cat] = JSON.parse(item.fields.Values || "[]"); } catch(e){ listsObj[cat] = []; }
    });
    var checksArr = (checksRes.value||[]).map(function(item){
      var c = fieldsToCheck(item.fields, item.id);
      checkItemIds[c.id] = item.id;
      return c;
    });

    state.loads = Object.values(loadsById).sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    state.checks = checksArr.sort(function(a,b){ return (b.checkDate||"").localeCompare(a.checkDate||""); });
    state.lists = listsObj;
  }

  async function createCheckRemote(check){
    var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackDailyChecks/items", {
      method: "POST", body: JSON.stringify({fields: checkToFields(check)}),
    });
    checkItemIds[check.id] = res.id;
  }

  async function createLoadRemote(load){
    var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLoads/items", {
      method: "POST", body: JSON.stringify({fields: loadToFields(load)}),
    });
    loadItemIds[load.id] = res.id;
    for(var i=0;i<load.packs.length;i++){
      var p = load.packs[i];
      var pres = await graphFetch("/sites/"+siteId+"/lists/SteriTrackPacks/items", {
        method: "POST", body: JSON.stringify({fields: packToFields(p, load.id)}),
      });
      packItemIds[p.id] = pres.id;
    }
  }
  async function updateLoadRemote(load){
    var itemId = loadItemIds[load.id];
    if(!itemId) return;
    await graphFetch("/sites/"+siteId+"/lists/SteriTrackLoads/items/"+itemId+"/fields", {
      method: "PATCH", body: JSON.stringify(loadToFields(load)),
    });
  }
  async function updatePackRemote(pack, loadId){
    var itemId = packItemIds[pack.id];
    if(!itemId) return;
    await graphFetch("/sites/"+siteId+"/lists/SteriTrackPacks/items/"+itemId+"/fields", {
      method: "PATCH", body: JSON.stringify(packToFields(pack, loadId)),
    });
  }
  async function upsertListRemote(category, values){
    var itemId = listItemIds[category];
    if(itemId){
      await graphFetch("/sites/"+siteId+"/lists/SteriTrackLists/items/"+itemId+"/fields", {
        method: "PATCH", body: JSON.stringify({Values: JSON.stringify(values)}),
      });
    } else {
      var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLists/items", {
        method: "POST", body: JSON.stringify({fields: {Title: category, Values: JSON.stringify(values)}}),
      });
      listItemIds[category] = res.id;
    }
  }

  function markSync(ok){ syncStatus = ok ? "ok" : "bad"; renderSyncDot(); }

  function addToList(cat, val){
    val = (val||"").trim();
    if(!val) return;
    if(state.lists[cat].indexOf(val) === -1){
      state.lists[cat] = state.lists[cat].concat([val]);
      upsertListRemote(cat, state.lists[cat]).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
    }
  }
  function findLoad(id){ return state.loads.filter(function(l){return l.id===id;})[0]; }
  function updateLoad(id, patch){
    state.loads = state.loads.map(function(l){ return l.id===id ? Object.assign({}, l, patch) : l; });
    render();
    updateLoadRemote(findLoad(id)).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
  }
  function updatePack(loadId, packId, patch){
    var updatedPack = null;
    state.loads = state.loads.map(function(l){
      if(l.id !== loadId) return l;
      var packs = l.packs.map(function(p){
        if(p.id!==packId) return p;
        updatedPack = Object.assign({}, p, patch);
        return updatedPack;
      });
      return Object.assign({}, l, {packs: packs});
    });
    render();
    if(updatedPack) updatePackRemote(updatedPack, loadId).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
  }
  // A whole-load quarantine (washer or steriliser cycle failure, before any per-pack
  // release check ever happens) must also quarantine every pack in it — otherwise those
  // packs are stuck showing their original "pending" status forever in reports/exports,
  // even though they were never actually released or used.
  function quarantineWholeLoad(load, reason){
    var now = new Date().toISOString();
    var updatedPacks = (load.packs||[]).map(function(p){
      return Object.assign({}, p, {status:"quarantined", quarantineReason: reason, releaseTime: now});
    });
    updateLoad(load.id, {stage:"quarantined", quarantineReason: reason, quarantinedAt: now, packs: updatedPacks});
    updatedPacks.forEach(function(p){
      updatePackRemote(p, load.id).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
    });
  }
  function nextLoadId(){
    var stamp = todayStamp();
    var todays = state.loads.filter(function(l){ return l.id.indexOf(stamp) !== -1; });
    return "W-" + stamp + "-" + String(todays.length+1).padStart(2,"0");
  }
  function nextCheckId(){
    var stamp = todayStamp();
    var todays = state.checks.filter(function(c){ return c.id.indexOf(stamp) !== -1; });
    return "DC-" + stamp + "-" + String(todays.length+1);
  }

  // ---------- render ----------
  var root = document.getElementById("app");

  function monthKey(iso){ return (iso||"").slice(0,7); } // "YYYY-MM"
  function currentMonthKey(){ return monthKey(new Date().toISOString()); }
  function loadRecordDates(l){
    if(l.stage === "quarantined") return [l.quarantinedAt || l.createdAt];
    var dates = (l.packs||[]).map(function(p){ return p.releaseTime || l.createdAt; });
    return dates.length ? dates : [l.createdAt];
  }

  function render(){
    var active = state.loads.filter(isActiveLoad);
    var history = state.loads.filter(function(l){ return !isActiveLoad(l); });

    var html = '';
    html += headerHTML(active.length);
    html += '<div class="content">';
    if(state.tab === "active"){
      html += active.length === 0 ? emptyStateHTML() : active.map(function(l){return cardHTML(l);}).join("");
    } else if(state.tab === "checks"){
      html += checksControlsHTML();
      var checksThisMonth = state.checks.filter(function(c){ return monthKey(c.checkDate) === state.checksMonth; });
      html += checksThisMonth.length === 0
        ? '<div style="text-align:center; color:var(--faint); font-size:14px; padding:64px 0;">No daily checks recorded for this month.</div>'
        : checksThisMonth.map(checkCardHTML).join("");
    } else {
      html += historyControlsHTML();
      var q = state.search.toLowerCase();
      var monthFiltered = history.filter(function(l){
        return loadRecordDates(l).some(function(d){ return monthKey(d) === state.exportMonth; });
      });
      var filtered = monthFiltered.filter(function(l){
        if(!q) return true;
        var packNames = (l.packs||[]).map(function(p){return p.name;}).join(" ");
        return (l.id+" "+(l.sterId||"")+" "+packNames+" "+l.operator).toLowerCase().indexOf(q) !== -1;
      });
      html += filtered.length === 0
        ? '<div style="text-align:center; color:var(--faint); font-size:14px; padding:64px 0;">No records for this month'+(q?" matching your search":"")+'.</div>'
        : filtered.map(function(l){ return cardHTML(l, true); }).join("");
    }
    html += '</div>';

    root.innerHTML = html;
    bindHeaderEvents();
    bindCardEvents();

    var overlayHost = document.createElement("div");
    if(state.showNew) overlayHost.innerHTML = newLoadSheetHTML();
    else if(state.showNewCheck) overlayHost.innerHTML = newCheckSheetHTML();
    else if(state.openLoadId) overlayHost.innerHTML = loadDetailHTML(findLoad(state.openLoadId));
    while(overlayHost.firstChild) root.appendChild(overlayHost.firstChild);

    if(state.showNew) bindNewLoadEvents();
    if(state.showNewCheck) bindNewCheckEvents();
    if(state.openLoadId) bindDetailEvents();
  }

  function railHTML(stage){
    var idx = stageIdx(stage === "quarantined" ? "washing" : stage);
    var html = '<div class="rail">';
    STAGES.forEach(function(s, i){
      var active = i <= idx && stage !== "quarantined";
      var isCurrent = s.key === stage;
      var bg = "#F4F5F6", color = "var(--faint)", border = "var(--line)";
      if(active){
        if(s.key==="washing"){ bg="var(--dirty)"; color="#fff"; border="var(--dirty)"; }
        else if(s.key==="ready_to_pack"||s.key==="sterilising"){ bg="#fff"; color="var(--ink)"; border="var(--lineStrong)"; }
        else { bg="var(--sterile)"; color="#fff"; border="var(--sterile)"; }
      }
      html += '<div class="rail-step" style="background:'+bg+'; color:'+color+'; border-color:'+border+
        (isCurrent?'; box-shadow:0 0 0 2px #1C1E2122':'')+'">'+s.label+'</div>';
      if(i<STAGES.length-1) html += '<span class="rail-arrow">›</span>';
    });
    html += '</div>';
    return html;
  }

  function packSummaryText(load){
    var names = (load.packs||[]).map(function(p){return p.name;});
    if(names.length === 0) return "No packs added";
    if(names.length <= 2) return names.join(", ");
    return names.slice(0,2).join(", ") + " +" + (names.length-2) + " more";

  // Builds the row set for the currently-selected export month, one row per pack
  // (a load with no packs, e.g. quarantined before packing, gets a single row).
  function monthExportRows(){
    var history = state.loads.filter(function(l){ return !isActiveLoad(l); });
    var monthFiltered = history.filter(function(l){
      return loadRecordDates(l).some(function(d){ return monthKey(d) === state.exportMonth; });
    });
    var rows = [];
    monthFiltered.forEach(function(l){
      if(l.stage === "quarantined" && !(l.packs||[]).length){
        rows.push({loadId:l.id, washerCycleNo:l.washerCycleNo||"", sterId:l.sterId||"", pack:"—", status:"quarantined (whole load)", class1:"", operator:l.operator||"", releaser:l.releaser||"", washerProgram:l.washerProgram||"", sterProgram:l.sterProgram||"", when: fmtTime(l.quarantinedAt||l.createdAt), reason:l.quarantineReason||""});
        return;
      }
      (l.packs||[]).forEach(function(p){
        if(monthKey(p.releaseTime||l.createdAt) !== state.exportMonth) return;
        rows.push({loadId:l.id, washerCycleNo:l.washerCycleNo||"", sterId:l.sterId||"", pack:p.name, status:p.status, class1:p.class1||"", operator:l.operator||"", releaser:p.releaser||"", washerProgram:l.washerProgram||"", sterProgram:l.sterProgram||"", when: p.releaseTime?fmtTime(p.releaseTime):"", reason:p.quarantineReason||""});
      });
    });
    return rows;
  }

    var data = [headers].concat(rows.map(function(r){
      return [r.loadId, r.washerCycleNo, r.sterId, r.pack, r.status, r.class1, r.operator, r.releaser, r.washerProgram, r.sterProgram, r.when, r.reason];

    var ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{wch:16},{wch:14},{wch:14},{wch:22},{wch:16},{wch:12},{wch:14},{wch:14},{wch:22},{wch:22},{wch:16},{wch:28}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Reprocessing Log");
    XLSX.writeFile(wb, "MoleSpot-SteriTrack-"+state.exportMonth+".xlsx");
  }

  function comboFieldHTML(id, label, value, options, placeholder){
    if(state.addingField === id){

  // ---------- Load Detail sheet ----------
  var detailDraft = {}; // scratch state for the currently-open inline form
  function loadDetailHTML(load){
    if(!load) return "";
    var stage = load.stage;
    var idx = stageIdx(stage === "quarantined" ? "washing" : stage);
    var body = '';
    body += railHTML(stage);
    body += summaryRow("Operator", load.operator);
    body += summaryRow("Packs", packSummaryText(load));

    if(stage === "quarantined"){
      body += '<div class="alert-box"><strong>⚠ Whole load quarantined</strong><br>'+esc(load.quarantineReason)+'</div>';
    }

    // Washer stage
    body += '<div class="stage-block '+(idx>0 && stage!=="quarantined"?"done":"pending")+'">'+
      '<div class="stage-head">💧 Washer-disinfector'+(idx>0 && stage!=="quarantined"?'<span class="check">✓</span>':'')+'</div>'+
      summaryRow("Cycle no.", load.washerCycleNo, true, true) + summaryRow("Program", load.washerProgram, true) + summaryRow("Started", fmtTime(load.washerStart), true);
    if(stage === "washing"){
      body += state.confirming === "washer_result" ? washerResultFormHTML() :
        '<button class="btn btn-primary" id="btn-washer-done">✓ Mark cycle complete</button>';
    }
    body += '</div>';

    // Pack & steriliser stage
    if(idx >= 1 && stage !== "quarantined"){
      body += '<div class="stage-block '+(idx>2?"done":"pending")+'">'+
        '<div class="stage-head">🧪 Pack & steriliser'+(idx>2?'<span class="check">✓</span>':'')+'</div>';
      if(stage === "ready_to_pack"){
        body += state.confirming === "pack" ? packFormHTML(load) :
          '<button class="btn btn-primary" id="btn-pack">📦 Pack &amp; start steriliser</button>';
      } else {
        if(load.sterId) body += summaryRow("MELAG batch no.", load.sterId, true, true);
        body += summaryRow("Program", load.sterProgram, true);
        body += summaryRow("Started", fmtTime(load.sterStart), true);
      }
      if(stage === "sterilising"){
        body += state.confirming === "ster_result" ? sterResultFormHTML() :
          '<button class="btn btn-primary" id="btn-ster-done">✓ Read batch no. &amp; mark complete</button>';
      }
      body += '</div>';
    }

    // Cool & release stage
    if(idx >= 3 && stage !== "quarantined"){
      body += '<div class="stage-block '+(stage==="done"?"done":"pending")+'">'+
        '<div class="stage-head">🛡 Cool & release'+(stage==="done"?'<span class="check">✓</span>':'')+'</div>';
      if(stage === "cooling"){
        body += state.confirming === "cool_setup" ? coolSetupFormHTML() :
          '<button class="btn btn-success" id="btn-cool-setup">🔒 Confirm cool-down &amp; releaser</button>';

        body += summaryRow("Cooled & confirmed by", load.releaser, true);
        body += packReleaseListHTML(load);

      body += '</div>';

        body += '<div class="stage-block pending"><div class="stage-head">👤 Patient linkage</div>'+
          '<div style="font-size:13px; color:var(--faint); margin-bottom:8px;">When each pack below is opened for use, record its batch + pack name directly in the patient\'s file in BP Premier. Not tracked here.</div>'+
          released.map(function(p){
            return '<div style="font-size:13px; padding:4px 0;">Batch <strong class="mono" style="color:var(--ink)">'+esc(load.sterId)+'</strong> — '+esc(p.name)+'</div>';
          }).join('') +
        '</div>';
      }
    }

    return '<div class="overlay" id="detail-overlay"><div class="sheet">'+
      '<div class="sheet-header"><div class="sheet-title mono">'+esc(load.id)+'</div><button class="sheet-close" id="detail-close">✕</button></div>'+
      '<div class="sheet-body">'+body+'</div>'+
    '</div></div>';

    if(state.confirming === "cool_setup"){
      var csCooled = document.getElementById("cs-cooled"); if(csCooled) csCooled.onchange = function(){ detailDraft.cooled = csCooled.checked; render(); };
      bindComboField("cs-releaser", "operators", function(v){ detailDraft.releaser=v; render(); }, render);
      var csCancel = document.getElementById("cs-cancel"); if(csCancel) csCancel.onclick = function(){ state.confirming=null; detailDraft={}; render(); };
      var csConfirm = document.getElementById("cs-confirm"); if(csConfirm) csConfirm.onclick = function(){
        updateLoad(load.id, {stage:"done", releaser: detailDraft.releaser});
        state.confirming = null; detailDraft = {};
      };
    }

    // per-pack release/quarantine, active once stage === "done"
    if(load.stage === "done"){
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-check]"), function(btn){
        btn.onclick = function(){ detailDraft.packChecking = btn.getAttribute("data-pack-check"); detailDraft.pouchOk = null; detailDraft.packReason = ""; render(); };
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-cancel]"), function(btn){
        btn.onclick = function(){ detailDraft.packChecking = null; render(); };
      });
      if(detailDraft.packChecking){
        var pid = detailDraft.packChecking;
        bindYnRow("pouch-"+pid, function(v){ detailDraft.pouchOk = v; render(); });
        var prReason = document.getElementById("pr-reason"); if(prReason) prReason.oninput = function(){
          detailDraft.packReason = prReason.value;
          var prBtn = document.querySelector('[data-pack-quarantine="'+pid+'"]'); if(prBtn) prBtn.disabled = !prReason.value.trim();
        };
      }
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-release]"), function(btn){
        btn.onclick = function(){
          var pid2 = btn.getAttribute("data-pack-release");
          updatePack(load.id, pid2, {status:"released", pouchOk:"Y", releaser: load.releaser, releaseTime: new Date().toISOString()});
          detailDraft.packChecking = null;
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-quarantine]"), function(btn){
        btn.onclick = function(){
          var pid3 = btn.getAttribute("data-pack-quarantine");
          updatePack(load.id, pid3, {status:"quarantined", pouchOk:"N", quarantineReason: detailDraft.packReason, releaseTime: new Date().toISOString()});
          detailDraft.packChecking = null;
        };
      });
    }
  }

  // ---------- Setup / connection screens ----------
  function connectingScreenHTML(msg){
    return '<div class="setup-wrap"><div class="setup-card">'+
      '<div class="setup-title display">Connecting…</div>'+
      '<div class="setup-sub">'+esc(msg||"Signing in and loading data from SharePoint.")+'</div>'+
    '</div></div>';
  }
  function errorScreenHTML(err){
    return '<div class="setup-wrap"><div class="setup-card">'+
      '<div class="setup-title display">Couldn\'t connect</div>'+
      '<div class="setup-err">'+esc(err)+'</div>'+
      '<button class="btn btn-primary" id="retry-btn" style="width:100%;">Try again</button>'+
    '</div></div>';
  }
  function bindErrorScreen(){
    var btn = document.getElementById("retry-btn");
    if(btn) btn.onclick = function(){ boot(); };
  }

  // ---------- Polling refresh (Graph has no live push, so refresh periodically) ----------
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(function(){
      // Skip a refresh cycle while the user is actively filling in a form, so we don't
      // wipe out unsaved input the same way the Supabase version was careful to avoid.
      if(state.showNew || state.confirming || state.addingField) return;
      fetchAllData().then(function(){ markSync(true); render(); }).catch(function(e){ console.error(e); markSync(false); });
    }, 25000);
  }

  // ---------- Boot ----------
  async function boot(){
    root.innerHTML = connectingScreenHTML();
    try {
      msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
      await msalInstance.initialize();

      var redirectResult = await msalInstance.handleRedirectPromise();
      if(redirectResult && redirectResult.account){
        activeAccount = redirectResult.account;
      } else {
        var accounts = msalInstance.getAllAccounts();
        if(accounts.length > 0){
          activeAccount = accounts[0];
        } else {
          // Not signed in yet — send to Microsoft sign-in. Page navigates away;
          // execution resumes above (handleRedirectPromise) after returning.
          await msalInstance.loginRedirect({scopes: GRAPH_SCOPES});
          return;
        }
      }
      msalInstance.setActiveAccount(activeAccount);

      root.innerHTML = connectingScreenHTML("Connecting to your SharePoint site…");
      await resolveSiteId();

      root.innerHTML = connectingScreenHTML("Loading loads and packs…");
      await fetchAllData();

      syncStatus = "ok";
      render();
      startPolling();
    } catch(e){
      console.error(e);
      syncStatus = "bad";
      root.innerHTML = errorScreenHTML(e.message || String(e));
      bindErrorScreen();
    }
  }

  boot();
})();
</script>
</body>
</html>
