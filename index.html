<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SteriTrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SteriTrack">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1C1E21; --inkSoft:#33363B; --sub:#5B6066; --faint:#9AA0A6;
    --line:#E3E5E7; --lineStrong:#C9D2D8; --bg:#F7F7F8; --panel:#2B2E33; --white:#FFFFFF;
    --dirty:#6B6F76; --dirtyBg:#EDEEF0; --sterile:#0F7A6C; --sterileBg:#0F7A6C1A;
    --alert:#B3261E; --alertBg:#B3261E0D; --alertBorder:#B3261E33;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}
  .display{font-family:-apple-system, BlinkMacSystemFont, sans-serif; font-weight:700;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}

  /* header */
  .header{position:sticky; top:0; z-index:20; background:var(--ink); color:var(--white);
    padding:calc(20px + env(safe-area-inset-top)) 20px 16px;}
  .header-row{display:flex; align-items:center; justify-content:space-between;}
  .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:600;}
  .title{font-size:22px; font-weight:700;}
  .btn-new{min-height:46px; padding:0 16px; background:var(--white); color:var(--ink);
    border:none; border-radius:12px; font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px;}
  .tabs{display:flex; gap:4px; margin-top:16px; background:var(--panel); border-radius:10px; padding:4px;}
  .tab{flex:1; min-height:40px; border:none; border-radius:8px; font-weight:600; font-size:13px;
    background:transparent; color:#C9CDD1; display:flex; align-items:center; justify-content:center; gap:6px;}
  .tab.active{background:var(--white); color:var(--ink);}

  .content{padding:16px; max-width:720px; margin:0 auto;}

  /* empty state */
  .empty{text-align:center; padding:80px 24px;}
  .empty-icon{width:56px; height:56px; border-radius:16px; background:var(--white); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:24px;}
  .empty-title{font-weight:700; margin-bottom:4px; font-size:16px;}
  .empty-sub{font-size:14px; color:var(--faint); margin-bottom:20px;}

  /* card */
  .card{width:100%; text-align:left; background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px; display:block;}
  .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px;}
  .card-id{font-size:13px; font-weight:600;}
  .badge{padding:2px 8px; font-size:12px; font-weight:600; border-radius:6px; white-space:nowrap;}
  .badge-neutral{background:var(--dirtyBg); color:#4A4E54;}
  .badge-sterile{background:var(--sterileBg); color:var(--sterile);}
  .badge-alert{background:#B3261E1A; color:var(--alert);}
  .card-contents{font-size:15px; font-weight:500; margin-bottom:2px;}
  .card-meta{font-size:13px; color:var(--faint); display:flex; gap:12px; flex-wrap:wrap;}

  /* zone rail */
  .rail{display:flex; align-items:center; gap:4px; width:100%; margin-top:12px;}
  .rail-step{flex:1; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; text-align:center; padding:0 4px;
    border:1px solid var(--line); background:#F4F5F6; color:var(--faint);}
  .rail-arrow{color:var(--lineStrong); font-size:12px; flex-shrink:0;}

  /* search/export row */
  .row-gap{display:flex; gap:8px; margin-bottom:12px;}
  .search-wrap{position:relative; flex:1;}
  .search-wrap input{padding-left:36px;}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:14px;}
  .btn-export{min-height:46px; padding:0 16px; border-radius:10px; border:1px solid var(--lineStrong);
    background:var(--white); font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; color:var(--ink);}

  /* form controls */
  .field{display:block; margin-bottom:16px;}
  .field-label{display:block; font-size:13px; font-weight:500; color:var(--sub); margin-bottom:6px;}
  .input, select.input{width:100%; min-height:46px; padding:0 14px; border-radius:10px; border:1px solid var(--lineStrong);
    background:var(--white); font-size:15px; color:var(--ink); outline:none;}
  select.input{appearance:auto; -webkit-appearance:menulist;}
  .yn-row{display:flex; gap:8px;}
  .yn-btn{flex:1; min-height:46px; border-radius:10px; font-weight:600; font-size:14px; border:1px solid var(--lineStrong);
    background:var(--white); color:var(--sub);}
  .yn-btn.sel-pos{background:var(--sterile); color:var(--white); border-color:var(--sterile);}
  .yn-btn.sel-neg{background:var(--alert); color:var(--white); border-color:var(--alert);}
  .checkbox-row{display:flex; align-items:center; gap:12px; background:var(--white); border:1px solid var(--lineStrong);
    border-radius:10px; padding:0 14px; min-height:46px; margin-bottom:8px;}
  .checkbox-row input{width:20px; height:20px;}

  /* buttons */
  .btn{min-height:52px; padding:0 20px; border-radius:12px; font-weight:600; font-size:15px; border:none;
    display:flex; align-items:center; justify-content:center; gap:8px; flex:1;}
  .btn-primary{background:var(--ink); color:var(--white);}
  .btn-ghost{background:var(--white); color:var(--ink); border:1px solid var(--lineStrong);}
  .btn-danger{background:var(--alert); color:var(--white);}
  .btn-success{background:var(--sterile); color:var(--white);}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn-row{display:flex; gap:8px;}

  /* sheet / modal */
  .overlay{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.3); display:flex;
    align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:560px; max-height:92vh; background:var(--bg); border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; overflow:hidden;}
  .sheet-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    border-bottom:1px solid var(--line); background:var(--white);}
  .sheet-title{font-size:17px; font-weight:700;}
  .sheet-close{width:36px; height:36px; border-radius:999px; background:#F4F5F6; border:none;
    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink);}
  .sheet-body{overflow-y:auto; padding:16px 20px; flex:1; -webkit-overflow-scrolling:touch;}
  .sheet-footer{padding:16px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);
    background:var(--white); display:flex; gap:8px;}

  /* stage blocks */
  .stage-block{border-radius:14px; padding:16px; margin-bottom:14px;}
  .stage-block.pending{border:1px solid var(--ink); background:var(--white);}
  .stage-block.done{border:1px solid var(--line); background:#FAFAFA;}
  .stage-head{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:600; font-size:14px;}
  .stage-head .check{margin-left:auto; color:var(--sterile);}
  .summary-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:13px;}
  .summary-row .val{font-weight:500; color:var(--ink); text-align:right;}
  .hint{font-size:13px; color:var(--sub); background:#F4F5F6; border-radius:10px; padding:12px; margin-bottom:16px;}
  .warn-text{font-size:13px; color:var(--alert); margin-bottom:8px;}
  .alert-box{background:var(--alertBg); border:1px solid var(--alertBorder); border-radius:10px; padding:14px;
    font-size:14px; color:var(--alert); margin-bottom:16px;}
  .quarantine-link{display:block; width:100%; text-align:center; font-size:13px; color:var(--alert);
    font-weight:500; padding-top:8px; background:none; border:none;}

  .toast{position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--faint); background:var(--white);
    border:1px solid var(--line); border-radius:999px; padding:4px 12px; z-index:40;}

  /* pack chips */
  .pack-add-row{display:flex; gap:8px; margin-bottom:10px;}
  .pack-add-row select{flex:1;}
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .chip{display:flex; align-items:center; gap:6px; background:var(--dirtyBg); border-radius:999px;
    padding:6px 6px 6px 14px; font-size:13px; font-weight:500;}
  .chip button{width:20px; height:20px; border-radius:999px; background:rgba(0,0,0,.08); border:none;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub);}
  .chip-empty{font-size:13px; color:var(--faint); padding:8px 0;}

  /* per-pack release card */
  .pack-item{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--white);}
  .pack-item.pack-released{background:var(--sterileBg); border-color:var(--sterile);}
  .pack-item.pack-quarantined{background:var(--alertBg); border-color:var(--alert);}
  .pack-item-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .pack-item-name{font-weight:600; font-size:14px;}

  .setup-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .setup-card{width:100%; max-width:440px; background:var(--white); border:1px solid var(--line); border-radius:16px; padding:28px; text-align:center;}
  .setup-title{font-size:20px; font-weight:700; margin-bottom:6px;}
  .setup-sub{font-size:13px; color:var(--sub); margin-bottom:20px; line-height:1.5;}
  .setup-err{font-size:13px; color:var(--alert); margin-bottom:16px; text-align:left; background:var(--alertBg); border:1px solid var(--alertBorder); border-radius:10px; padding:12px;}
  .sync-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:6px;}
  .sync-dot.ok{background:var(--sterile);}
  .sync-dot.bad{background:var(--alert);}
  .sync-dot.pending{background:#E0A800;}
  .signed-in-as{font-size:11px; color:var(--faint); margin-top:2px;}
  .signout-link{font-size:11px; color:var(--faint); text-decoration:underline; background:none; border:none; padding:0;}

  /* month filter + export row */
  .export-row{display:flex; gap:8px; flex-wrap:wrap;}
  .month-input{min-height:46px; padding:0 12px; border-radius:10px; border:1px solid var(--lineStrong); background:var(--white); font-size:14px; color:var(--ink);}

  /* printable report — hidden on screen, shown only when printing */
  #print-report{display:none;}
  @media print {
    body > *:not(#print-report){display:none !important;}
    #print-report{display:block !important; padding:24px; font-family:-apple-system,sans-serif; color:#111;}
    #print-report h1{font-size:20px; margin:0 0 4px;}
    #print-report .pr-sub{font-size:12px; color:#555; margin-bottom:18px;}
    #print-report table{width:100%; border-collapse:collapse; font-size:11px;}
    #print-report th, #print-report td{border:1px solid #999; padding:5px 7px; text-align:left;}
    #print-report th{background:#eee;}
    #print-report .pr-summary{font-size:12px; margin-bottom:14px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report"></div>
<script>
(function(){
  "use strict";

  // ---------- Microsoft 365 / SharePoint configuration ----------
  var MSAL_CONFIG = {
    auth: {
      clientId: "3da51dfd-c402-4ddd-b05e-0b8cfcdab763",
      authority: "https://login.microsoftonline.com/57a5a310-7a72-4b1d-8a77-ef7338ab2035",
      redirectUri: "https://mohehsani.github.io/molespot-steritrack/",
    },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false },
  };
  var GRAPH_SCOPES = ["Sites.ReadWrite.All"];
  var SP_HOSTNAME = "molespot.sharepoint.com";
  var SP_SITE_PATH = "/sites/MoleSpotSkinCancerClinic";
  var GRAPH_BASE = "https://graph.microsoft.com/v1.0";
  // SharePoint keeps the internal field name "Title" for the built-in column even after
  // it's been renamed (LoadId / BatchId / PackId / Category / CheckId) in the UI.
  var TITLE_FIELD = "Title";

  var msalInstance = null;
  var activeAccount = null;
  var siteId = null;
  var syncStatus = "pending"; // pending | ok | bad
  var pollTimer = null;

  var DEFAULT_LISTS = {
    instrumentSets: [], washerPrograms: [], operators: [],
    sterPrograms: ["Universal-Program 134°C wrapped", "Quick-Program S 134°C unwrapped", "Gentle-Program 121°C", "Prion-Program 134°C wrapped"],
    checkTypes: ["Vacuum Test", "Washer Disinfector Soil Test (AXCP120)"]
  };
  var PPE_ITEMS = ["Utility/heavy-duty gloves","Protective eyewear or face shield","Fluid-resistant apron/gown","Closed footwear"];

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function todayStamp(){
    var d = new Date();
    return "" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  }
  function fmtTime(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleString("en-AU", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function monthKey(iso){ return (iso||"").slice(0,7); }
  function currentMonthKey(){ return monthKey(new Date().toISOString()); }

  // ---------- Microsoft Graph helpers ----------
  async function getToken(){
    try {
      var res = await msalInstance.acquireTokenSilent({scopes: GRAPH_SCOPES, account: activeAccount});
      return res.accessToken;
    } catch(e){
      var res2 = await msalInstance.acquireTokenRedirect({scopes: GRAPH_SCOPES});
      return null;
    }
  }
  async function graphFetch(path, options){
    options = options || {};
    var token = await getToken();
    var headers = Object.assign({
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
    }, options.headers || {});
    var res = await fetch(GRAPH_BASE + path, Object.assign({}, options, {headers: headers}));
    if(!res.ok){
      var body = await res.text();
      throw new Error("Graph " + res.status + ": " + body.slice(0, 300));
    }
    if(res.status === 204) return null;
    return res.json();
  }
  async function resolveSiteId(){
    var data = await graphFetch("/sites/" + SP_HOSTNAME + ":" + SP_SITE_PATH);
    siteId = data.id;
  }
  function markSync(ok){ syncStatus = ok ? "ok" : "bad"; renderSyncDot(); }

  // ---------- Data mapping: app object <-> SharePoint list item fields ----------
  // SteriTrackLoads = WASHER LOADS ONLY now (steriliser fields moved to SteriTrackSterBatches).
  function washerLoadToFields(l){
    return {
      Title: l.id, CycleNo: l.cycleNo||"", Program: l.program||"", StartTime: l.startTime||null,
      Result: l.result||"", Operator: l.operator||"", Stage: l.stage,
      QuarantineReason: l.quarantineReason||"", QuarantinedAt: l.quarantinedAt||null,
    };
  }
  function fieldsToWasherLoad(f, itemId){
    return {
      id: f.Title, cycleNo: f.CycleNo||null, program: f.Program, startTime: f.StartTime,
      result: f.Result, operator: f.Operator, stage: f.Stage,
      quarantineReason: f.QuarantineReason, quarantinedAt: f.QuarantinedAt,
      createdAt: f.Created || new Date().toISOString(),
      _itemId: itemId,
    };
  }
  // SteriTrackSterBatches (new list)
  function sterBatchToFields(b){
    return {
      Title: b.id, SterId: b.sterId||"", SterProgram: b.program||"", SterStart: b.startTime||null,
      SterResult: b.result||"", Stage: b.stage, Releaser: b.releaser||"",
      QuarantineReason: b.quarantineReason||"", QuarantinedAt: b.quarantinedAt||null,
    };
  }
  function fieldsToSterBatch(f, itemId){
    return {
      id: f.Title, sterId: f.SterId||null, program: f.SterProgram, startTime: f.SterStart,
      result: f.SterResult, stage: f.Stage, releaser: f.Releaser,
      quarantineReason: f.QuarantineReason, quarantinedAt: f.QuarantinedAt,
      createdAt: f.Created || new Date().toISOString(),
      _itemId: itemId,
    };
  }
  // SteriTrackPacks — LoadId links to washer load; SterBatchId links to steriliser batch (blank until assigned)
  function packToFields(p){
    return {
      Title: p.id, LoadId: p.washerLoadId||"", SterBatchId: p.sterBatchId||"", Name: p.name||"",
      Class1: p.class1||"", PouchOk: p.pouchOk||"", Status: p.status,
      QuarantineReason: p.quarantineReason||"", ReleaseTime: p.releaseTime||null, Releaser: p.releaser||"",
    };
  }
  function fieldsToPack(f, itemId){
    return {
      id: f.Title, washerLoadId: f.LoadId, sterBatchId: f.SterBatchId||null, name: f.Name,
      class1: f.Class1||null, pouchOk: f.PouchOk||null, status: f.Status,
      quarantineReason: f.QuarantineReason, releaseTime: f.ReleaseTime, releaser: f.Releaser||null,
      _itemId: itemId,
    };
  }
  function checkToFields(c){
    return {
      Title: c.id, CheckType: c.checkType||"", CheckDate: c.checkDate||null,
      Result: c.result||"", Operator: c.operator||"", Notes: c.notes||"",
    };
  }
  function fieldsToCheck(f, itemId){
    return {
      id: f.Title, checkType: f.CheckType, checkDate: f.CheckDate,
      result: f.Result, operator: f.Operator, notes: f.Notes, _itemId: itemId,
    };
  }

  // ---------- state ----------
  var state = {
    washerLoads: [], sterBatches: [], packs: [], checks: [],
    lists: Object.assign({}, DEFAULT_LISTS),
    tab: "active",           // active | pool | history | checks
    openLoadId: null, openBatchId: null,
    showNew: false, showNewCheck: false, showNewBatch: false,
    search: "",
    exportMonth: currentMonthKey(), checksMonth: currentMonthKey(),
    confirming: null, addingField: null,
    poolSelection: {},       // { packId: true }
  };
  var loadItemIds = {}, batchItemIds = {}, packItemIds = {}, listItemIds = {}, checkItemIds = {};

  async function fetchAllData(){
    var loadsRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLoads/items?expand=fields&$top=500");
    var batchesRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackSterBatches/items?expand=fields&$top=500");
    var packsRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackPacks/items?expand=fields&$top=1000");
    var listsRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLists/items?expand=fields&$top=100");
    var checksRes = await graphFetch("/sites/"+siteId+"/lists/SteriTrackDailyChecks/items?expand=fields&$top=1000");

    loadItemIds = {}; batchItemIds = {}; packItemIds = {}; listItemIds = {}; checkItemIds = {};
    var loads = (loadsRes.value||[]).map(function(item){
      var l = fieldsToWasherLoad(item.fields, item.id);
      loadItemIds[l.id] = item.id;
      return l;
    });
    var batches = (batchesRes.value||[]).map(function(item){
      var b = fieldsToSterBatch(item.fields, item.id);
      batchItemIds[b.id] = item.id;
      return b;
    });
    var packs = (packsRes.value||[]).map(function(item){
      var p = fieldsToPack(item.fields, item.id);
      packItemIds[p.id] = item.id;
      return p;
    });
    var listsObj = Object.assign({}, DEFAULT_LISTS);
    (listsRes.value||[]).forEach(function(item){
      var cat = item.fields.Title;
      listItemIds[cat] = item.id;
      try { listsObj[cat] = JSON.parse(item.fields.Values || "[]"); } catch(e){ listsObj[cat] = []; }
    });
    var checks = (checksRes.value||[]).map(function(item){
      var c = fieldsToCheck(item.fields, item.id);
      checkItemIds[c.id] = item.id;
      return c;
    });

    state.washerLoads = loads.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    state.sterBatches = batches.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    state.packs = packs;
    state.lists = listsObj;
    state.checks = checks.sort(function(a,b){ return (b.checkDate||"").localeCompare(a.checkDate||""); });
  }

  async function createWasherLoadRemote(load, packs){
    var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLoads/items", {
      method: "POST", body: JSON.stringify({fields: washerLoadToFields(load)}),
    });
    loadItemIds[load.id] = res.id;
    for(var i=0;i<packs.length;i++){
      var p = packs[i];
      var pres = await graphFetch("/sites/"+siteId+"/lists/SteriTrackPacks/items", {
        method: "POST", body: JSON.stringify({fields: packToFields(p)}),
      });
      packItemIds[p.id] = pres.id;
    }
  }
  async function updateWasherLoadRemote(load){
    var itemId = loadItemIds[load.id];
    if(!itemId) return;
    await graphFetch("/sites/"+siteId+"/lists/SteriTrackLoads/items/"+itemId+"/fields", {
      method: "PATCH", body: JSON.stringify(washerLoadToFields(load)),
    });
  }
  async function createSterBatchRemote(batch){
    var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackSterBatches/items", {
      method: "POST", body: JSON.stringify({fields: sterBatchToFields(batch)}),
    });
    batchItemIds[batch.id] = res.id;
  }
  async function updateSterBatchRemote(batch){
    var itemId = batchItemIds[batch.id];
    if(!itemId) return;
    await graphFetch("/sites/"+siteId+"/lists/SteriTrackSterBatches/items/"+itemId+"/fields", {
      method: "PATCH", body: JSON.stringify(sterBatchToFields(batch)),
    });
  }
  async function updatePackRemote(pack){
    var itemId = packItemIds[pack.id];
    if(!itemId) return;
    await graphFetch("/sites/"+siteId+"/lists/SteriTrackPacks/items/"+itemId+"/fields", {
      method: "PATCH", body: JSON.stringify(packToFields(pack)),
    });
  }
  async function createCheckRemote(check){
    var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackDailyChecks/items", {
      method: "POST", body: JSON.stringify({fields: checkToFields(check)}),
    });
    checkItemIds[check.id] = res.id;
  }
  async function upsertListRemote(category, values){
    var itemId = listItemIds[category];
    if(itemId){
      await graphFetch("/sites/"+siteId+"/lists/SteriTrackLists/items/"+itemId+"/fields", {
        method: "PATCH", body: JSON.stringify({Values: JSON.stringify(values)}),
      });
    } else {
      var res = await graphFetch("/sites/"+siteId+"/lists/SteriTrackLists/items", {
        method: "POST", body: JSON.stringify({fields: {Title: category, Values: JSON.stringify(values)}}),
      });
      listItemIds[category] = res.id;
    }
  }

  function addToList(cat, val){
    val = (val||"").trim();
    if(!val) return;
    if(state.lists[cat].indexOf(val) === -1){
      state.lists[cat] = state.lists[cat].concat([val]);
      upsertListRemote(cat, state.lists[cat]).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
    }
  }
  function findLoad(id){ return state.washerLoads.filter(function(l){return l.id===id;})[0]; }
  function findBatch(id){ return state.sterBatches.filter(function(b){return b.id===id;})[0]; }
  function packsOf(loadId){ return state.packs.filter(function(p){ return p.washerLoadId===loadId; }); }
  function packsInBatch(batchId){ return state.packs.filter(function(p){ return p.sterBatchId===batchId; }); }

  function updateWasherLoad(id, patch){
    state.washerLoads = state.washerLoads.map(function(l){ return l.id===id ? Object.assign({}, l, patch) : l; });
    render();
    updateWasherLoadRemote(findLoad(id)).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
  }
  function updateSterBatch(id, patch){
    state.sterBatches = state.sterBatches.map(function(b){ return b.id===id ? Object.assign({}, b, patch) : b; });
    render();
    updateSterBatchRemote(findBatch(id)).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
  }
  function updatePack(id, patch){
    var updated = null;
    state.packs = state.packs.map(function(p){
      if(p.id!==id) return p;
      updated = Object.assign({}, p, patch);
      return updated;
    });
    render();
    if(updated) updatePackRemote(updated).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
  }
  // Whole-load quarantine (washer cycle failure) cascades to every pack washed in it,
  // since none of them can proceed without being reprocessed from the start.
  function quarantineWholeLoad(load, reason){
    var now = new Date().toISOString();
    updateWasherLoad(load.id, {stage:"quarantined", quarantineReason: reason, quarantinedAt: now});
    packsOf(load.id).forEach(function(p){
      updatePack(p.id, {status:"quarantined", quarantineReason: reason, releaseTime: now});
    });
  }
  // Whole-batch quarantine (steriliser cycle failure) cascades to every pack assigned to it —
  // these packs may have come from several different washer loads.
  function quarantineWholeBatch(batch, reason){
    var now = new Date().toISOString();
    updateSterBatch(batch.id, {stage:"quarantined", quarantineReason: reason, quarantinedAt: now});
    packsInBatch(batch.id).forEach(function(p){
      updatePack(p.id, {status:"quarantined", quarantineReason: reason, releaseTime: now});
    });
  }
  function nextLoadId(){
    var stamp = todayStamp();
    var todays = state.washerLoads.filter(function(l){ return l.id.indexOf(stamp) !== -1; });
    return "W-" + stamp + "-" + String(todays.length+1).padStart(2,"0");
  }
  function nextBatchId(){
    var stamp = todayStamp();
    var todays = state.sterBatches.filter(function(b){ return b.id.indexOf(stamp) !== -1; });
    return "S-" + stamp + "-" + String(todays.length+1).padStart(2,"0");
  }
  function nextCheckId(){
    var stamp = todayStamp();
    var todays = state.checks.filter(function(c){ return c.id.indexOf(stamp) !== -1; });
    return "DC-" + stamp + "-" + String(todays.length+1);
  }

  function isActiveLoad(l){ return l.stage === "washing"; }
  function isActiveBatch(b){
    if(b.stage === "quarantined") return false;
    if(b.stage !== "done") return true;
    return packsInBatch(b.id).some(function(p){ return p.status==="assigned"; });
  }
  function poolPacks(){
    // Packs that have finished washing, aren't quarantined, and haven't yet been
    // picked up into a steriliser batch — may span several different washer loads.
    return state.packs.filter(function(p){
      if(p.sterBatchId || p.status==="quarantined") return false;
      var load = findLoad(p.washerLoadId);
      return load && load.stage === "done";
    });
  }
  function batchOverallStatus(b){
    if(b.stage === "quarantined") return {label:"Quarantined", tone:"alert"};
    if(b.stage !== "done"){
      var label = b.stage === "sterilising" ? "Sterilising" : b.stage === "cooling" ? "Cooling" : b.stage;
      return {label: label, tone:"neutral"};
    }
    var packs = packsInBatch(b.id);
    var released = packs.filter(function(p){return p.status==="released";}).length;
    var quarantined = packs.filter(function(p){return p.status==="quarantined";}).length;
    var assigned = packs.filter(function(p){return p.status==="assigned";}).length;
    if(assigned > 0) return {label:"Releasing ("+(released+quarantined)+"/"+packs.length+")", tone:"neutral"};
    if(quarantined === 0) return {label:"Released", tone:"sterile"};
    if(released === 0) return {label:"All quarantined", tone:"alert"};
    return {label:"Partially released", tone:"alert"};
  }

  // ---------- render ----------
  var root = document.getElementById("app");

  function render(){
    var activeLoads = state.washerLoads.filter(isActiveLoad);
    var activeBatches = state.sterBatches.filter(isActiveBatch);
    var activeCount = activeLoads.length + activeBatches.length;

    var html = '';
    html += headerHTML(activeCount);
    html += '<div class="content">';
    if(state.tab === "active"){
      if(activeCount === 0) html += emptyStateHTML();
      else {
        html += activeLoads.map(function(l){ return loadCardHTML(l); }).join("");
        html += activeBatches.map(function(b){ return batchCardHTML(b); }).join("");
      }
    } else if(state.tab === "pool"){
      html += poolHTML();
    } else if(state.tab === "checks"){
      html += checksControlsHTML();
      var checksThisMonth = state.checks.filter(function(c){ return monthKey(c.checkDate) === state.checksMonth; });
      html += checksThisMonth.length === 0
        ? '<div style="text-align:center; color:var(--faint); font-size:14px; padding:64px 0;">No daily checks recorded for this month.</div>'
        : checksThisMonth.map(checkCardHTML).join("");
    } else {
      html += historyControlsHTML();
      var q = state.search.toLowerCase();
      var rows = monthExportRows();
      var historyItems = historyCards(q);
      html += historyItems.length === 0
        ? '<div style="text-align:center; color:var(--faint); font-size:14px; padding:64px 0;">No records for this month'+(q?" matching your search":"")+'.</div>'
        : historyItems.join("");
    }
    html += '</div>';

    root.innerHTML = html;
    bindHeaderEvents();
    bindCardEvents();

    var overlayHost = document.createElement("div");
    if(state.showNew) overlayHost.innerHTML = newLoadSheetHTML();
    else if(state.showNewBatch) overlayHost.innerHTML = newBatchSheetHTML();
    else if(state.showNewCheck) overlayHost.innerHTML = newCheckSheetHTML();
    else if(state.openLoadId) overlayHost.innerHTML = loadDetailHTML(findLoad(state.openLoadId));
    else if(state.openBatchId) overlayHost.innerHTML = batchDetailHTML(findBatch(state.openBatchId));
    while(overlayHost.firstChild) root.appendChild(overlayHost.firstChild);

    if(state.showNew) bindNewLoadEvents();
    if(state.showNewBatch) bindNewBatchEvents();
    if(state.showNewCheck) bindNewCheckEvents();
    if(state.openLoadId) bindLoadDetailEvents();
    if(state.openBatchId) bindBatchDetailEvents();
  }

  function headerHTML(activeCount){
    var name = activeAccount ? (activeAccount.name || activeAccount.username) : "";

    var poolCount = poolPacks().length;
    return ''+
    '<div class="header">'+
      '<div class="header-row">'+
        '<div><div class="eyebrow">MoleSpot Skin Cancer Clinic</div>'+
          '<div class="title display" id="sync-title">SteriTrack <span class="sync-dot '+syncStatus+'" id="sync-dot" title="'+syncStatus+'"></span></div>'+
          '<div class="signed-in-as">'+esc(name)+' · <button class="signout-link" id="btn-signout">Sign out</button></div>'+
        '</div>'+
        '<button class="btn-new" id="btn-new-load">'+newLabel+'</button>'+
      '</div>'+
      '<div class="tabs">'+
        '<button class="tab '+(state.tab==="active"?"active":"")+'" data-tab="active">In progress ('+activeCount+')</button>'+
        '<button class="tab '+(state.tab==="pool"?"active":"")+'" data-tab="pool">Ready to sterilise ('+poolCount+')</button>'+
        '<button class="tab '+(state.tab==="history"?"active":"")+'" data-tab="history">History</button>'+
        '<button class="tab '+(state.tab==="checks"?"active":"")+'" data-tab="checks">Daily Checks</button>'+
      '</div>'+
    '</div>';
  }
  function renderSyncDot(){
    var dot = document.getElementById("sync-dot");
    if(dot){ dot.className = "sync-dot " + syncStatus; dot.title = syncStatus; }
  }
  function bindHeaderEvents(){
    document.getElementById("btn-new-load").onclick = function(){
      if(state.tab === "checks"){ state.showNewCheck = true; } else { state.showNew = true; }
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(btn){
      btn.onclick = function(){ state.tab = btn.getAttribute("data-tab"); state.poolSelection = {}; render(); };
    });
    var signoutBtn = document.getElementById("btn-signout");
    if(signoutBtn) signoutBtn.onclick = function(){
      stopPolling();

    };

  function emptyStateHTML(){
    return '<div class="empty">'+
      '<div class="empty-icon">💧</div>'+
      '<div class="empty-title display">Nothing in progress</div>'+
      '<div class="empty-sub">Start a new washer load to begin tracking a batch of instruments.</div>'+
      '<button class="btn btn-primary" style="display:inline-flex; flex:none;" id="btn-empty-new">+ Start a wash load</button>'+
    '</div>';
  }

  function loadCardHTML(l){
    var status = l.stage === "quarantined" ? {label:"Quarantined", tone:"alert"} : {label:"Washing", tone:"neutral"};
    var packs = packsOf(l.id);
    var names = packs.map(function(p){return p.name;});
    var summary = names.length===0 ? "No packs added" : names.length<=2 ? names.join(", ") : names.slice(0,2).join(", ")+" +"+(names.length-2)+" more";
    return '<button class="card" data-open-load="'+l.id+'">'+
      '<div class="card-top"><div class="card-id mono">💧 '+esc(l.id)+'</div>'+
      '<span class="badge badge-'+status.tone+'">'+esc(status.label)+'</span></div>'+
      '<div class="card-contents">'+esc(summary)+' <span style="color:var(--faint); font-weight:400;">('+packs.length+' pack'+(packs.length===1?'':'s')+')</span></div>'+
      '<div class="card-meta"><span>👤 '+esc(l.operator||"—")+'</span><span>🕒 '+fmtTime(l.createdAt)+'</span></div>'+
    '</button>';
  }
  function batchCardHTML(b){
    var status = batchOverallStatus(b);
    var packs = packsInBatch(b.id);
    var names = packs.map(function(p){return p.name;});
    var summary = names.length===0 ? "No packs" : names.length<=2 ? names.join(", ") : names.slice(0,2).join(", ")+" +"+(names.length-2)+" more";
    return '<button class="card" data-open-batch="'+b.id+'">'+
      '<div class="card-top"><div class="card-id mono">🧪 '+esc(b.id)+(b.sterId?' → '+esc(b.sterId):'')+'</div>'+
      '<span class="badge badge-'+status.tone+'">'+esc(status.label)+'</span></div>'+
      '<div class="card-contents">'+esc(summary)+' <span style="color:var(--faint); font-weight:400;">('+packs.length+' pack'+(packs.length===1?'':'s')+')</span></div>'+
      '<div class="card-meta"><span>🕒 '+fmtTime(b.createdAt)+'</span></div>'+
    '</button>';
  }

  function bindCardEvents(){
    var newBtn = document.getElementById("btn-empty-new");
    if(newBtn) newBtn.onclick = function(){ state.showNew = true; render(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-open-load]"), function(btn){
      btn.onclick = function(){ state.openLoadId = btn.getAttribute("data-open-load"); state.confirming = null; render(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-open-batch]"), function(btn){
      btn.onclick = function(){ state.openBatchId = btn.getAttribute("data-open-batch"); state.confirming = null; render(); };
    });
    // Pool tab
    Array.prototype.forEach.call(document.querySelectorAll("[data-pool-check]"), function(cb){
      cb.onchange = function(){
        var id = cb.getAttribute("data-pool-check");
        if(cb.checked) state.poolSelection[id] = true; else delete state.poolSelection[id];
        render();
      };
    });
    var startBatchBtn = document.getElementById("btn-start-batch");
    if(startBatchBtn) startBatchBtn.onclick = function(){ state.showNewBatch = true; render(); };
    // History
    var monthInput = document.getElementById("month-input");
    if(monthInput) monthInput.onchange = function(){ state.exportMonth = monthInput.value; render(); };
    var searchInput = document.getElementById("search-input");
    if(searchInput) searchInput.oninput = function(){ state.search = searchInput.value; render(); searchInput.focus(); searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length; };
    var exportExcelBtn = document.getElementById("btn-export-excel");
    if(exportExcelBtn) exportExcelBtn.onclick = exportExcel;
    var exportPdfBtn = document.getElementById("btn-export-pdf");
    if(exportPdfBtn) exportPdfBtn.onclick = exportPdf;
    Array.prototype.forEach.call(document.querySelectorAll("[data-hist-open-load]"), function(btn){
      btn.onclick = function(){ state.openLoadId = btn.getAttribute("data-hist-open-load"); render(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-hist-open-batch]"), function(btn){
      btn.onclick = function(){ state.openBatchId = btn.getAttribute("data-hist-open-batch"); render(); };
    });
    // Daily checks
    var checksMonthInput = document.getElementById("checks-month-input");
    if(checksMonthInput) checksMonthInput.onchange = function(){ state.checksMonth = checksMonthInput.value; render(); };
    var checksExcelBtn = document.getElementById("btn-export-checks-excel");
    if(checksExcelBtn) checksExcelBtn.onclick = exportChecksExcel;
    var checksPdfBtn = document.getElementById("btn-export-checks-pdf");
    if(checksPdfBtn) checksPdfBtn.onclick = exportChecksPdf;
  }

  // ---------- Ready to Sterilise pool ----------
  function poolHTML(){
    var packs = poolPacks();
    var selectedCount = Object.keys(state.poolSelection).length;
    var html = '';
    if(packs.length === 0){
      html += '<div style="text-align:center; color:var(--faint); font-size:14px; padding:64px 0;">No washed packs waiting — they\'ll appear here once a wash cycle passes.</div>';
      return html;
    }
    html += '<div class="hint">Select which washed packs are going into the steriliser now — they can come from more than one wash load.</div>';
    packs.forEach(function(p){
      var load = findLoad(p.washerLoadId);
      var checked = !!state.poolSelection[p.id];
      html += '<label class="pack-item" style="display:flex; align-items:center; gap:12px; cursor:pointer;">'+
        '<input type="checkbox" data-pool-check="'+p.id+'" '+(checked?"checked":"")+' style="width:22px; height:22px; flex:none;">'+
        '<div style="flex:1;"><div class="pack-item-name">'+esc(p.name)+'</div>'+
        '<div style="font-size:12px; color:var(--faint);">From '+esc(load?load.id:"—")+(load&&load.cycleNo?' · Cycle '+esc(load.cycleNo):'')+'</div></div>'+
      '</label>';
    });
    html += '<div class="btn-row" style="margin-top:12px;"><button class="btn btn-primary" id="btn-start-batch" '+(selectedCount>0?"":"disabled")+'>🧪 Start steriliser batch ('+selectedCount+' selected)</button></div>';
    return html;
  }

  function historyControlsHTML(){
    return '<div class="row-gap">'+
      '<input type="month" class="month-input" id="month-input" value="'+esc(state.exportMonth)+'">'+
      '<div class="search-wrap"><span class="search-icon">🔍</span>'+
        '<input class="input" id="search-input" placeholder="Search load/batch ID, pack, operator…" value="'+esc(state.search)+'"></div>'+
    '</div>'+
    '<div class="export-row" style="margin-bottom:12px;">'+
      '<button class="btn-export" id="btn-export-excel">📊 Export Excel</button>'+
      '<button class="btn-export" id="btn-export-pdf">🖨 Export PDF</button>'+
    '</div>';
  }
  function historyCards(q){
    var histLoads = state.washerLoads.filter(function(l){ return !isActiveLoad(l); });
    var histBatches = state.sterBatches.filter(function(b){ return !isActiveBatch(b); });
    var items = [];
    histLoads.forEach(function(l){
      var dates = packsOf(l.id).map(function(p){return p.releaseTime||l.quarantinedAt||l.createdAt;});
      if(dates.length===0) dates=[l.quarantinedAt||l.createdAt];
      if(!dates.some(function(d){return monthKey(d)===state.exportMonth;})) return;
      var names = packsOf(l.id).map(function(p){return p.name;}).join(" ");
      if(q && (l.id+" "+names+" "+l.operator).toLowerCase().indexOf(q)===-1) return;
      items.push({sortKey:l.createdAt, html: histLoadCardHTML(l)});
    });
    histBatches.forEach(function(b){
      var dates = packsInBatch(b.id).map(function(p){return p.releaseTime||b.quarantinedAt||b.createdAt;});
      if(dates.length===0) dates=[b.quarantinedAt||b.createdAt];
      if(!dates.some(function(d){return monthKey(d)===state.exportMonth;})) return;
      var names = packsInBatch(b.id).map(function(p){return p.name;}).join(" ");
      if(q && (b.id+" "+(b.sterId||"")+" "+names).toLowerCase().indexOf(q)===-1) return;
      items.push({sortKey:b.createdAt, html: histBatchCardHTML(b)});
    });
    items.sort(function(a,z){ return (z.sortKey||"").localeCompare(a.sortKey||""); });
    return items.map(function(i){return i.html;});
  }
  function histLoadCardHTML(l){
    var status = l.stage === "quarantined" ? {label:"Quarantined", tone:"alert"} : {label:"Washed", tone:"sterile"};
    var packs = packsOf(l.id);
    var names = packs.map(function(p){return p.name;});
    var summary = names.length<=2 ? names.join(", ") : names.slice(0,2).join(", ")+" +"+(names.length-2)+" more";
    return '<button class="card" data-hist-open-load="'+l.id+'">'+
      '<div class="card-top"><div class="card-id mono">💧 '+esc(l.id)+'</div>'+
      '<span class="badge badge-'+status.tone+'">'+esc(status.label)+'</span></div>'+
      '<div class="card-contents">'+esc(summary)+' <span style="color:var(--faint); font-weight:400;">('+packs.length+' pack'+(packs.length===1?'':'s')+')</span></div>'+
      '<div class="card-meta"><span>👤 '+esc(l.operator||"—")+'</span><span>🕒 '+fmtTime(l.createdAt)+'</span></div>'+
    '</button>';
  }
  function histBatchCardHTML(b){
    var status = batchOverallStatus(b);
    var packs = packsInBatch(b.id);
    var names = packs.map(function(p){return p.name;});
    var summary = names.length<=2 ? names.join(", ") : names.slice(0,2).join(", ")+" +"+(names.length-2)+" more";
    return '<button class="card" data-hist-open-batch="'+b.id+'">'+
      '<div class="card-top"><div class="card-id mono">🧪 '+esc(b.id)+(b.sterId?' → '+esc(b.sterId):'')+'</div>'+
      '<span class="badge badge-'+status.tone+'">'+esc(status.label)+'</span></div>'+
      '<div class="card-contents">'+esc(summary)+' <span style="color:var(--faint); font-weight:400;">('+packs.length+' pack'+(packs.length===1?'':'s')+')</span></div>'+
      '<div class="card-meta"><span>🕒 '+fmtTime(b.createdAt)+'</span></div>'+
    '</button>';
  }

  // ---------- Exports (pack-centric: one row per resolved pack) ----------
  function monthExportRows(){
    var rows = [];
    state.packs.forEach(function(p){
      if(p.status!=="released" && p.status!=="quarantined") return;
      var when = p.releaseTime;
      if(monthKey(when) !== state.exportMonth) return;
      var load = findLoad(p.washerLoadId);
      var batch = p.sterBatchId ? findBatch(p.sterBatchId) : null;
      rows.push({
        loadId: load?load.id:"—", washerCycleNo: load?(load.cycleNo||""):"",
        batchId: batch?batch.id:"—", sterId: batch?(batch.sterId||""):"",
        pack: p.name, status: p.status, class1: p.class1||"",
        operator: load?(load.operator||""):"", releaser: p.releaser||"",
        washerProgram: load?(load.program||""):"", sterProgram: batch?(batch.program||""):"",
        when: fmtTime(when), reason: p.quarantineReason||"",
      });
    });
    rows.sort(function(a,b){ return a.loadId.localeCompare(b.loadId); });
    return rows;
  }
  function exportExcel(){
    var rows = monthExportRows();
    var headers = ["Washer Load ID","Washer Cycle No.","Steriliser Batch ID","Steriliser Batch No.","Pack Name","Pack Status","Class 1 Indicator","Operator","Releaser","Washer Program","Steriliser Program","Date/Time","Quarantine Reason"];
    var data = [headers].concat(rows.map(function(r){
      return [r.loadId, r.washerCycleNo, r.batchId, r.sterId, r.pack, r.status, r.class1, r.operator, r.releaser, r.washerProgram, r.sterProgram, r.when, r.reason];
    }));
    var ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{wch:16},{wch:14},{wch:16},{wch:14},{wch:22},{wch:16},{wch:12},{wch:14},{wch:14},{wch:22},{wch:22},{wch:16},{wch:28}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Reprocessing Log");
    XLSX.writeFile(wb, "MoleSpot-SteriTrack-"+state.exportMonth+".xlsx");
  }
  function exportPdf(){
    var rows = monthExportRows();
    var monthLabel = new Date(state.exportMonth+"-01").toLocaleDateString("en-AU", {month:"long", year:"numeric"});
    var html = '<h1>MoleSpot Skin Cancer Clinic — SteriTrack Reprocessing Log</h1>'+
      '<div class="pr-sub">'+esc(monthLabel)+' · Generated '+fmtTime(new Date().toISOString())+'</div>'+
      '<div class="pr-summary">'+rows.length+' record'+(rows.length===1?"":"s")+' this month.</div>'+
      '<table><thead><tr><th>Washer Load ID</th><th>Washer Cycle No.</th><th>Steriliser Batch ID</th><th>Steriliser Batch No.</th><th>Pack Name</th><th>Pack Status</th><th>Class 1</th>'+
      '<th>Operator</th><th>Releaser</th><th>Washer Program</th><th>Steriliser Program</th><th>Date/Time</th><th>Quarantine Reason</th></tr></thead><tbody>';
    if(rows.length === 0){

      selectedPacks.forEach(function(p){
        var pc = detailDraft.packChecks[p.id] || {};
        state.packs = state.packs.map(function(pp){
          return pp.id===p.id ? Object.assign({}, pp, {class1: pc.class1, sterBatchId: batch.id, status:"assigned"}) : pp;
        });
      });
      state.poolSelection = {};
      state.openBatchId = batch.id;
      closeNewBatch();
      createSterBatchRemote(batch).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
      selectedPacks.forEach(function(p){
        var updated = state.packs.filter(function(pp){return pp.id===p.id;})[0];
        if(updated) updatePackRemote(updated).then(function(){ markSync(true); }).catch(function(e){ console.error(e); markSync(false); });
      });
    };
  }

  // ---------- Steriliser Batch detail ----------
  function batchDetailHTML(batch){
    if(!batch) return "";
    var packs = packsInBatch(batch.id);
    var body = '';
    body += summaryRow("Program", batch.program);
    body += summaryRow("Started", fmtTime(batch.startTime));
    if(batch.sterId) body += summaryRow("MELAG batch no.", batch.sterId, false, true);
    if(batch.stage === "quarantined"){
      body += '<div class="alert-box"><strong>⚠ Batch quarantined</strong><br>'+esc(batch.quarantineReason)+'</div>';
    }
    if(batch.stage === "sterilising"){
      body += state.confirming === "ster_result" ? sterResultFormHTML() :
        '<button class="btn btn-primary" id="btn-ster-done">✓ Read batch no. &amp; mark complete</button>';
    } else if(batch.stage === "cooling"){
      body += state.confirming === "cool_setup" ? coolSetupFormHTML() :
        '<button class="btn btn-success" id="btn-cool-setup">🔒 Confirm cool-down &amp; releaser</button>';
    } else if(batch.stage === "done"){
      body += summaryRow("Cooled & confirmed by", batch.releaser);
      body += packReleaseListHTML(packs);
      var released = packs.filter(function(p){return p.status==="released";});
      if(released.length){
        body += '<div class="stage-block pending"><div class="stage-head">👤 Patient linkage</div>'+
          '<div style="font-size:13px; color:var(--faint); margin-bottom:8px;">When each pack below is opened for use, record its batch + pack name directly in the patient\'s file in BP Premier. Not tracked here.</div>'+
          released.map(function(p){
            return '<div style="font-size:13px; padding:4px 0;">Batch <strong class="mono" style="color:var(--ink)">'+esc(batch.sterId)+'</strong> — '+esc(p.name)+'</div>';
          }).join('') +
        '</div>';
      }
    }
    return '<div class="overlay" id="batch-detail-overlay"><div class="sheet">'+
      '<div class="sheet-header"><div class="sheet-title mono">🧪 '+esc(batch.id)+'</div><button class="sheet-close" id="batch-detail-close">✕</button></div>'+
      '<div class="sheet-body">'+body+'</div>'+
    '</div></div>';
  }
  function sterResultFormHTML(){
    var d = detailDraft;
    var batchNo = d.batchNo||"", params = d.params||null, reason = d.sterReason||"";
    var anyNo = params==="N";
    var bothOk = params==="Y" && batchNo;
    var html = '<div style="padding-top:8px;">';
    html += '<div class="field"><span class="field-label">MELAG batch number (read from steriliser display)</span>'+
      '<input class="input" id="sr-batch" value="'+esc(batchNo)+'" placeholder="e.g. 46"></div>';
    html += '<div class="field"><span class="field-label">Time/temp/pressure parameters achieved</span>'+ynRowHTML("params", params)+'</div>';
    if(anyNo){
      html += '<div class="field"><span class="field-label">Reason for failure</span><input class="input" id="sr-reason" value="'+esc(reason)+'"></div>';
    }
    html += '<div class="btn-row"><button class="btn btn-ghost" id="sr-cancel">Cancel</button>';
    if(anyNo){
      html += '<button class="btn btn-danger" id="sr-quarantine" '+((reason||"").trim()?"":"disabled")+'>⚠ Quarantine batch</button>';
    } else {
      html += '<button class="btn btn-success" id="sr-confirm" '+(bothOk?"":"disabled")+'>✓ Confirm &amp; cool</button>';
    }
    html += '</div></div>';
    return html;
  }
  function coolSetupFormHTML(){
    var d = detailDraft;
    var cooled = !!d.cooled, releaser = d.releaser||"";
    var canProceed = cooled && releaser;
    var html = '<div style="padding-top:8px;">';
    html += '<label class="checkbox-row"><input type="checkbox" id="cs-cooled" '+(cooled?"checked":"")+'>'+
      '<span>Packs cooled undisturbed — no condensation or damage</span></label>';
    html += comboFieldHTML("cs-releaser", "Releaser name/initials", releaser, state.lists.operators, "Select releaser…");
    html += '<div class="btn-row"><button class="btn btn-ghost" id="cs-cancel">Cancel</button>'+
      '<button class="btn btn-success" id="cs-confirm" '+(canProceed?"":"disabled")+'>Continue to per-pack release</button></div>';
    html += '</div>';
    return html;
  }
  function packReleaseListHTML(packs){
    var html = '<div style="padding-top:4px;">';
    packs.forEach(function(p){
      var cls = p.status==="released" ? "pack-released" : p.status==="quarantined" ? "pack-quarantined" : "";
      html += '<div class="pack-item '+cls+'"><div class="pack-item-head">'+
        '<span class="pack-item-name">'+esc(p.name)+'</span>'+
        '<span class="badge badge-'+(p.status==="released"?"sterile":p.status==="quarantined"?"alert":"neutral")+'">'+esc(p.status==="assigned"?"pending":p.status)+'</span>'+
        '</div>';
      if(p.status === "assigned"){
        var checking = detailDraft.packChecking === p.id;
        if(checking){
          var pouch = detailDraft.pouchOk || null;
          var reason = detailDraft.packReason || "";
          html += '<div class="field"><span class="field-label">Pouch dry, sealed, intact</span>'+ynRowHTML("pouch-"+p.id, pouch)+'</div>';
          if(pouch === "N"){
            html += '<div class="field"><span class="field-label">Reason</span><input class="input" id="pr-reason" value="'+esc(reason)+'"></div>';
            html += '<div class="btn-row"><button class="btn btn-ghost" data-pack-cancel="'+p.id+'">Cancel</button>'+
              '<button class="btn btn-danger" data-pack-quarantine="'+p.id+'" '+((reason||"").trim()?"":"disabled")+'>⚠ Quarantine pack</button></div>';
          } else {
            html += '<div class="btn-row"><button class="btn btn-ghost" data-pack-cancel="'+p.id+'">Cancel</button>'+
              '<button class="btn btn-success" data-pack-release="'+p.id+'" '+(pouch==="Y"?"":"disabled")+'>🔒 Release pack</button></div>';
          }
        } else {
          html += '<button class="btn btn-primary" data-pack-check="'+p.id+'" style="min-height:44px;">Check &amp; release this pack</button>';
        }
      } else if(p.status === "quarantined") {
        html += '<div style="font-size:13px; color:var(--alert);">'+esc(p.quarantineReason||"")+'</div>';
      } else if(p.status === "released") {
        html += summaryRow("Released", fmtTime(p.releaseTime), true);
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }
  function closeBatchDetail(){ state.openBatchId = null; state.confirming = null; detailDraft = {}; state.addingField = null; render(); }
  function bindBatchDetailEvents(){
    var batch = findBatch(state.openBatchId);
    if(!batch) return;
    document.getElementById("batch-detail-close").onclick = closeBatchDetail;
    document.getElementById("batch-detail-overlay").onclick = function(e){ if(e.target.id==="batch-detail-overlay") closeBatchDetail(); };
    var btnSter = document.getElementById("btn-ster-done"); if(btnSter) btnSter.onclick = function(){ state.confirming="ster_result"; detailDraft={}; render(); };
    var btnCoolSetup = document.getElementById("btn-cool-setup"); if(btnCoolSetup) btnCoolSetup.onclick = function(){ state.confirming="cool_setup"; detailDraft={}; render(); };

    if(state.confirming === "ster_result"){
      var srBatch = document.getElementById("sr-batch"); if(srBatch) srBatch.oninput = function(){ detailDraft.batchNo = srBatch.value; };
      bindYnRow("params", function(v){ detailDraft.params=v; render(); });
      var srReason = document.getElementById("sr-reason"); if(srReason) srReason.oninput = function(){
        detailDraft.sterReason = srReason.value;
        var srBtn = document.getElementById("sr-quarantine"); if(srBtn) srBtn.disabled = !srReason.value.trim();
      };
      var srCancel = document.getElementById("sr-cancel"); if(srCancel) srCancel.onclick = function(){ state.confirming=null; detailDraft={}; render(); };
      var srConfirm = document.getElementById("sr-confirm"); if(srConfirm) srConfirm.onclick = function(){
        updateSterBatch(batch.id, {stage:"cooling", result:"pass", sterId:detailDraft.batchNo});
        state.confirming = null; detailDraft = {};
      };
      var srQ = document.getElementById("sr-quarantine"); if(srQ) srQ.onclick = function(){
        quarantineWholeBatch(batch, "Steriliser cycle failed: "+detailDraft.sterReason);
        state.confirming = null; detailDraft = {};
      };
    }
    if(state.confirming === "cool_setup"){
      var csCooled = document.getElementById("cs-cooled"); if(csCooled) csCooled.onchange = function(){ detailDraft.cooled = csCooled.checked; render(); };
      bindComboField("cs-releaser", "operators", function(v){ detailDraft.releaser=v; render(); }, render);
      var csCancel = document.getElementById("cs-cancel"); if(csCancel) csCancel.onclick = function(){ state.confirming=null; detailDraft={}; render(); };
      var csConfirm = document.getElementById("cs-confirm"); if(csConfirm) csConfirm.onclick = function(){
        updateSterBatch(batch.id, {stage:"done", releaser: detailDraft.releaser});
        state.confirming = null; detailDraft = {};
      };
    }
    if(batch.stage === "done"){
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-check]"), function(btn){
        btn.onclick = function(){ detailDraft.packChecking = btn.getAttribute("data-pack-check"); detailDraft.pouchOk = null; detailDraft.packReason = ""; render(); };
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-cancel]"), function(btn){
        btn.onclick = function(){ detailDraft.packChecking = null; render(); };
      });
      if(detailDraft.packChecking){
        var pid = detailDraft.packChecking;
        bindYnRow("pouch-"+pid, function(v){ detailDraft.pouchOk = v; render(); });
        var prReason = document.getElementById("pr-reason"); if(prReason) prReason.oninput = function(){
          detailDraft.packReason = prReason.value;
          var prBtn = document.querySelector('[data-pack-quarantine="'+pid+'"]'); if(prBtn) prBtn.disabled = !prReason.value.trim();
        };
      }
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-release]"), function(btn){
        btn.onclick = function(){
          var pid2 = btn.getAttribute("data-pack-release");
          updatePack(pid2, {status:"released", pouchOk:"Y", releaser: batch.releaser, releaseTime: new Date().toISOString()});
          detailDraft.packChecking = null;
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-pack-quarantine]"), function(btn){
        btn.onclick = function(){
          var pid3 = btn.getAttribute("data-pack-quarantine");
          updatePack(pid3, {status:"quarantined", pouchOk:"N", quarantineReason: detailDraft.packReason, releaseTime: new Date().toISOString()});
          detailDraft.packChecking = null;
        };
      });
    }
  }

  // ---------- Setup / connection screens ----------
  function connectingScreenHTML(msg){
    return '<div class="setup-wrap"><div class="setup-card">'+
      '<div class="setup-title display">Connecting…</div>'+
      '<div class="setup-sub">'+esc(msg||"Signing in and loading data from SharePoint.")+'</div>'+
    '</div></div>';
  }
  function errorScreenHTML(err){
    return '<div class="setup-wrap"><div class="setup-card">'+
      '<div class="setup-title display">Couldn\'t connect</div>'+
      '<div class="setup-err">'+esc(err)+'</div>'+
      '<button class="btn btn-primary" id="retry-btn" style="width:100%;">Try again</button>'+
    '</div></div>';
  }
  function bindErrorScreen(){
    var btn = document.getElementById("retry-btn");
    if(btn) btn.onclick = function(){ boot(); };
  }
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(function(){
      if(state.showNew || state.showNewBatch || state.confirming || state.addingField) return;
      fetchAllData().then(function(){ markSync(true); render(); }).catch(function(e){ console.error(e); markSync(false); });
    }, 25000);
  }
  async function boot(){
    root.innerHTML = connectingScreenHTML();
    try {
      msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
      await msalInstance.initialize();
      var redirectResult = await msalInstance.handleRedirectPromise();
      if(redirectResult && redirectResult.account){
        activeAccount = redirectResult.account;
      } else {
        var accounts = msalInstance.getAllAccounts();
        if(accounts.length > 0){ activeAccount = accounts[0]; }
        else { await msalInstance.loginRedirect({scopes: GRAPH_SCOPES}); return; }
      }
      msalInstance.setActiveAccount(activeAccount);
      root.innerHTML = connectingScreenHTML("Connecting to your SharePoint site…");
      await resolveSiteId();
      root.innerHTML = connectingScreenHTML("Loading loads, batches and packs…");
      await fetchAllData();
      syncStatus = "ok";
      render();
      startPolling();
    } catch(e){
      console.error(e);
      syncStatus = "bad";
      root.innerHTML = errorScreenHTML(e.message || String(e));
      bindErrorScreen();
    }
  }

  boot();
})();
</script>
</body>
</html>
